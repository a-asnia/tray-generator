function buildContainer(c, conn, opts = {}) {

    const L = layout(c);
    const solids = [];
    const tan = (deg) => Math.tan((deg * Math.PI) / 180);
    // Галтель: небольшое скругление внутреннего угла в месте примыкания
    // перегородки к корпусу — веер вертикальных треугольных призм
    // (вертикальные поверхности, печатается без поддержек)
    const FILLET_R = 2, FILLET_SEGS = 4;
    // ownBox — индекс бокса, чья это собственная галтель (его полость
    // проверкой не отсекается); для остальных галтель не должна попасть
    // внутрь полости бокса (например, когда бокс занимает угол корпуса)
    const addFillet = (cx, cz, dx, dz, h, tag, ownBox = -1) => {
        if (opts.fillets === false || h < 1.5)
            return;
        const r = FILLET_R;
        const qx0 = Math.min(cx, cx + dx * r), qx1 = Math.max(cx, cx + dx * r);
        const qz0 = Math.min(cz, cz + dz * r), qz1 = Math.max(cz, cz + dz * r);
        for (const f of L.fixed)
            if (f.k !== ownBox && qx1 > f.x0 + 0.01 && qx0 < f.x1 - 0.01 && qz1 > f.z0 + 0.01 && qz0 < f.z1 - 0.01)
                return;
        const pts = [];
        for (let s = 0; s <= FILLET_SEGS; s++) {
            const t = (s / FILLET_SEGS) * (Math.PI / 2);
            pts.push([cx + dx * r * (1 - Math.sin(t)), cz + dz * r * (1 - Math.cos(t))]);
        }
        for (let s = 0; s + 1 < pts.length; s++) {
            const q = [[cx, cz], pts[s], pts[s + 1], pts[s + 1]];
            solids.push(prismSolid(q.map(([x, z]) => [x, 0, z]), q.map(([x, z]) => [x, h, z]), tag));
        }
    };
    // высота стенки на её конце (учитывая спуск кромки)
    const hAtEnd = (wc, atStart) => {
        if (wc.drop === "none")
            return wc.h;
        const low = wc.drop === (atStart ? "a" : "b");
        return low ? Math.max(0.4, Math.min(wc.dropH, wc.h)) : wc.h;
    };
    const zonesOf = (side) => conn[side]
        ? conn[side].vs
            .map((vc) => [vc - CONN.bossW / 2, vc + CONN.bossW / 2])
            .sort((a, b) => a[0] - b[0])
        : [];
    const zN = zonesOf("N"), zS = zonesOf("S"), zW = zonesOf("W"), zE = zonesOf("E");
    const addRamp = (orient, facePos, dir, s0, s1, h, tilt, cellSize, embed, thk, wc, yBase, tag) => {
        if (tilt < 0.5 || h <= yBase + 0.3)
            return;
        const run = Math.min((h - yBase) * tan(tilt), cellSize * 0.45);
        if (run < 0.15)
            return;
        if (wc.face === "hex")
            buildHexRamp(orient, facePos, dir, s0, s1, h, yBase, run, thk, wc.hexSize, embed, tag);
        else if (wc.face === "lines")
            buildLinesRamp(orient, facePos, dir, s0, s1, h, yBase, run, thk, wc, embed, tag);
        else
            solids.push(rampSolid(orient, facePos, dir, s0, s1, h, yBase, run, embed, tag));
    };
    // экструзия профиля стенки вдоль отрезка s0..s1; mapFn(смещение, y, s) → точка
    const pushProfiled = (parts, mapFn, s0, s1, tag) => {
        for (const quad of parts) {
            const qa = quad.map(([o, y]) => mapFn(o, y, s0));
            const qb = quad.map(([o, y]) => mapFn(o, y, s1));
            solids.push(prismSolid(qa, qb, tag));
        }
    };
    // высота кромки в точке frac (0..1) вдоль сегмента: спуск четверть-эллипсом —
    // горизонтальный старт на высоком конце, почти вертикальный финиш (как дуга,
    // нарисованная пользователем)
    const heightAt = (frac, h, drop, dropH) => {
        if (drop === "none")
            return h;
        const t = drop === "b" ? frac : 1 - frac; // t=0 — высокий конец
        return h - (h - dropH) * (1 - Math.cos((t * Math.PI) / 2));
    };
    // тело стенки с учётом спуска кромки: сегмент режется на ломтики вдоль
    // длины, каждый ломтик — призма между профилями двух соседних высот.
    // S0..S1 — полный пролёт сегмента (для непрерывности дуги через вырезы зон)
    const pushWallBody = (key, wc, thk, sym, s0, s1, S0, S1, mapFn) => {
        const dropH = Math.min(wc.dropH, wc.h);
        if (wc.drop === "none" || wc.h - dropH < 0.3) {
            pushProfiled(wallProfile(thk, wc.h, wc.rnd, sym), mapFn, s0, s1, key);
            return;
        }
        const N = 12;
        const span = S1 - S0 || 1;
        for (let k = 0; k < N; k++) {
            const sa = s0 + ((s1 - s0) * k) / N;
            const sb = s0 + ((s1 - s0) * (k + 1)) / N;
            const h0 = Math.max(0.4, heightAt((sa - S0) / span, wc.h, wc.drop, dropH));
            const h1 = Math.max(0.4, heightAt((sb - S0) / span, wc.h, wc.drop, dropH));
            const pa = wallProfile(thk, h0, wc.rnd, sym);
            const pb = wallProfile(thk, h1, wc.rnd, sym);
            for (let q = 0; q < Math.max(pa.length, pb.length); q++) {
                const qa = (pa[q] ?? pa[pa.length - 1]).map(([o, y]) => mapFn(o, y, sa));
                const qb = (pb[q] ?? pb[pb.length - 1]).map(([o, y]) => mapFn(o, y, sb));
                solids.push(prismSolid(qa, qb, key));
            }
        }
    };
    // Сотовая стенка: рамка (низ/верх/бока) + гексагональная решётка из
    // брусков. Гексы вершиной вверх: потолки отверстий — два ската по 60°,
    // печатается вертикально без поддержек. Верхний пояс несёт скругление.
    const buildHexWall = (key, wc, thk, sym, s0, s1, mapFn) => {
        const strut = Math.max(1.2, Math.min(2.2, thk));
        const oA = sym ? -thk / 2 : 0, oB = sym ? thk / 2 : thk;
        const rect = (sa, sb, ya, yb) => {
            const q = [[sa, ya], [sb, ya], [sb, yb], [sa, yb]];
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA, yv, sv)), q.map(([sv, yv]) => mapFn(oB, yv, sv)), key));
        };
        const railSide = 2.5;
        const yA = floor + 3;
        const parts = wallProfile(thk, wc.h, wc.rnd, sym);
        const yB = Math.min(wc.h - 3.5, parts.length > 1 ? parts[0][2][1] : wc.h - 3.5);
        const sA = s0 + railSide, sB = s1 - railSide;
        if (sB - sA < wc.hexSize * 0.9 || yB - yA < wc.hexSize * 0.9) {
            // окно слишком маленькое — сплошная стенка
            pushProfiled(parts, mapFn, s0, s1, key);
            return;
        }
        // рамка
        rect(s0, s1, 0, yA); // нижний пояс
        const topParts = parts.map((q, qi) => (qi === 0 ? q.map(([o, y]) => [o, y === 0 ? yB : y]) : q));
        pushProfiled(topParts, mapFn, s0, s1, key); // верхний пояс (со скруглением)
        rect(s0, sA, yA, yB);
        rect(sB, s1, yA, yB); // боковые пояса
        // решётка
        const clipSeg = (P1, P2) => {
            let t0 = 0, t1 = 1;
            const dx = P2[0] - P1[0], dy = P2[1] - P1[1];
            const p = [-dx, dx, -dy, dy], q = [P1[0] - sA, sB - P1[0], P1[1] - yA, yB - P1[1]];
            for (let i = 0; i < 4; i++) {
                if (p[i] === 0) {
                    if (q[i] < 0)
                        return null;
                }
                else {
                    const r = q[i] / p[i];
                    if (p[i] < 0) {
                        if (r > t1)
                            return null;
                        if (r > t0)
                            t0 = r;
                    }
                    else {
                        if (r < t0)
                            return null;
                        if (r < t1)
                            t1 = r;
                    }
                }
            }
            return [[P1[0] + t0 * dx, P1[1] + t0 * dy], [P1[0] + t1 * dx, P1[1] + t1 * dy]];
        };
        const bar = (P1, P2) => {
            const c2 = clipSeg(P1, P2);
            if (!c2)
                return;
            const [A, B] = c2;
            const dx = B[0] - A[0], dy = B[1] - A[1];
            const len = Math.hypot(dx, dy);
            if (len < 0.4)
                return;
            const nx = (-dy / len) * (strut / 2), ny = (dx / len) * (strut / 2);
            const q = [[A[0] - nx, A[1] - ny], [A[0] + nx, A[1] + ny], [B[0] + nx, B[1] + ny], [B[0] - nx, B[1] - ny]];
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA, yv, sv)), q.map(([sv, yv]) => mapFn(oB, yv, sv)), key));
        };
        const Whex = wc.hexSize; // ширина соты между вертикальными гранями
        const R = Whex / Math.sqrt(3); // радиус до вершины
        // только ЦЕЛЫЕ ряды сот по высоте: неполный верхний ряд не рисуется,
        // остаток до верхнего пояса заливается пластиком
        let rows = 0;
        while (yA + R + rows * 1.5 * R + R <= yB + 0.01)
            rows++;
        if (rows < 1) {
            pushProfiled(parts.map((q, qi) => (qi === 0 ? q.map(([o, y]) => [o, y === 0 ? yA : y]) : q)), mapFn, s0, s1, key);
            return;
        }
        const colsN = Math.ceil((sB - sA) / Whex) + 2;
        for (let r = 0; r < rows; r++) {
            const yc = yA + R + r * 1.5 * R;
            const shift = r % 2 === 1 ? Whex / 2 : 0;
            for (let ci = -1; ci < colsN; ci++) {
                const sc = sA + Whex / 2 + ci * Whex + shift;
                const V = [
                    [sc, yc + R], [sc + Whex / 2, yc + R / 2], [sc + Whex / 2, yc - R / 2],
                    [sc, yc - R], [sc - Whex / 2, yc - R / 2], [sc - Whex / 2, yc + R / 2],
                ];
                for (let e = 0; e < 6; e++)
                    bar(V[e], V[(e + 1) % 6]);
            }
        }
        // заливка над последним целым рядом: клинья между вершинами + сплошная полоса
        const yTip = yA + R + (rows - 1) * 1.5 * R + R;
        const yValley = yTip - R / 2;
        const shiftN = rows % 2 === 1 ? Whex / 2 : 0;
        const oA2 = sym ? -thk / 2 : 0, oB2 = sym ? thk / 2 : thk;
        for (let ci = -1; ci < colsN + 1; ci++) {
            const sc = sA + Whex / 2 + ci * Whex + shiftN;
            const P = [[sc, yValley], [sc - Whex / 2, yTip], [sc + Whex / 2, yTip]]
                .map(([sv, yv]) => [Math.min(sB, Math.max(sA, sv)), yv]);
            if (Math.max(P[0][0], P[1][0], P[2][0]) - Math.min(P[0][0], P[1][0], P[2][0]) < 0.3)
                continue;
            const q = [P[0], P[1], P[2], P[2]];
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA2, yv, sv)), q.map(([sv, yv]) => mapFn(oB2, yv, sv)), key));
        }
        if (yB - yTip > 0.05)
            rect(sA, sB, yTip, yB);
    };
    // Стенка с фоном из изогнутых случайных линий: рамка как у сот + два
    // семейства волнистых диагональных прядей (±45°, печатаются без поддержек).
    // Узор детерминированный: сид зависит от стенки; «перемешать» меняет сид.
    const buildLinesWall = (key, wc, thk, sym, s0, s1, mapFn) => {
        const strut = Math.max(1.2, Math.min(2.2, thk));
        const oA = sym ? -thk / 2 : 0, oB = sym ? thk / 2 : thk;
        const rect = (sa, sb, ya, yb) => {
            const q = [[sa, ya], [sb, ya], [sb, yb], [sa, yb]];
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA, yv, sv)), q.map(([sv, yv]) => mapFn(oB, yv, sv)), key));
        };
        const railSide = 2.5;
        const yA = floor + 3;
        const parts = wallProfile(thk, wc.h, wc.rnd, sym);
        const yB = Math.min(wc.h - 3.5, parts.length > 1 ? parts[0][2][1] : wc.h - 3.5);
        const sA = s0 + railSide, sB = s1 - railSide;
        const sp = Math.max(4, wc.lineStep);
        if (sB - sA < sp || yB - yA < sp) {
            pushProfiled(parts, mapFn, s0, s1, key);
            return;
        }
        rect(s0, s1, 0, yA);
        const topParts = parts.map((q, qi) => (qi === 0 ? q.map(([o, y]) => [o, y === 0 ? yB : y]) : q));
        pushProfiled(topParts, mapFn, s0, s1, key);
        rect(s0, sA, yA, yB);
        rect(sB, s1, yA, yB);
        const clipSeg = (P1, P2) => {
            let t0 = 0, t1 = 1;
            const dx = P2[0] - P1[0], dy = P2[1] - P1[1];
            const p = [-dx, dx, -dy, dy], q = [P1[0] - sA, sB - P1[0], P1[1] - yA, yB - P1[1]];
            for (let i = 0; i < 4; i++) {
                if (p[i] === 0) {
                    if (q[i] < 0)
                        return null;
                }
                else {
                    const r = q[i] / p[i];
                    if (p[i] < 0) {
                        if (r > t1)
                            return null;
                        if (r > t0)
                            t0 = r;
                    }
                    else {
                        if (r < t0)
                            return null;
                        if (r < t1)
                            t1 = r;
                    }
                }
            }
            return [[P1[0] + t0 * dx, P1[1] + t0 * dy], [P1[0] + t1 * dx, P1[1] + t1 * dy]];
        };
        const bar = (P1, P2) => {
            const c2 = clipSeg(P1, P2);
            if (!c2)
                return;
            const [A, B] = c2;
            const dx = B[0] - A[0], dy = B[1] - A[1];
            const len = Math.hypot(dx, dy);
            if (len < 0.4)
                return;
            const nx = (-dy / len) * (strut / 2), ny = (dx / len) * (strut / 2);
            const q = [[A[0] - nx, A[1] - ny], [A[0] + nx, A[1] + ny], [B[0] + nx, B[1] + ny], [B[0] - nx, B[1] - ny]];
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA, yv, sv)), q.map(([sv, yv]) => mapFn(oB, yv, sv)), key));
        };
        // расширенное окно клипа: концы прядей заходят вглубь поясов рамки
        // и сращиваются с ними — без зазоров на стыке
        const ext = 2.3;
        const sAe = sA - ext, sBe = sB + ext;
        const hbTop = parts.length > 1 ? parts[0][2][1] : wc.h;
        const yAe = Math.max(0.4, yA - 2.6);
        const yBe = Math.min(yB + 3, hbTop - 0.15, wc.h - 0.4);
        const clipT = (P1, P2) => {
            let t0 = 0, t1 = 1;
            const dx = P2[0] - P1[0], dy = P2[1] - P1[1];
            const p = [-dx, dx, -dy, dy], q = [P1[0] - sAe, sBe - P1[0], P1[1] - yAe, yBe - P1[1]];
            for (let i = 0; i < 4; i++) {
                if (p[i] === 0) {
                    if (q[i] < 0)
                        return null;
                }
                else {
                    const r = q[i] / p[i];
                    if (p[i] < 0) {
                        if (r > t1)
                            return null;
                        if (r > t0)
                            t0 = r;
                    }
                    else {
                        if (r < t0)
                            return null;
                        if (r < t1)
                            t1 = r;
                    }
                }
            }
            return { A: [P1[0] + t0 * dx, P1[1] + t0 * dy], B: [P1[0] + t1 * dx, P1[1] + t1 * dy], t0, t1 };
        };
        // жёсткие границы тела стенки: лента (с учётом полуширины!) никогда
        // не выходит за края сегмента, ниже дна и выше начала скругления
        const pushQ = (q0) => {
            const q = q0.map(([sv, yv]) => [
                Math.min(s1 - 0.05, Math.max(s0 + 0.05, sv)),
                Math.min(hbTop - 0.05, Math.max(0.2, yv)),
            ]);
            const area = Math.abs(q[0][0] * (q[1][1] - q[3][1]) + q[1][0] * (q[2][1] - q[0][1]) +
                q[2][0] * (q[3][1] - q[1][1]) + q[3][0] * (q[0][1] - q[2][1])) / 2;
            if (area < 0.15)
                return; // полностью сплющенные о границу — отбрасываем
            solids.push(prismSolid(q.map(([sv, yv]) => mapFn(oA, yv, sv)), q.map(([sv, yv]) => mapFn(oB, yv, sv)), key));
        };
        const emitStrand = (pts, hws) => {
            let run = [], rw = [];
            const flush = () => { if (run.length > 1)
                for (const q of ribbonQuads(run, rw))
                    pushQ(q); run = []; rw = []; };
            for (let k = 0; k + 1 < pts.length; k++) {
                const c2 = clipT(pts[k], pts[k + 1]);
                if (!c2) {
                    flush();
                    continue;
                }
                const wA = hws[k] + (hws[k + 1] - hws[k]) * c2.t0;
                const wB = hws[k] + (hws[k + 1] - hws[k]) * c2.t1;
                if (run.length === 0) {
                    run.push(c2.A);
                    rw.push(wA);
                }
                run.push(c2.B);
                rw.push(wB);
                if (c2.t1 < 0.999)
                    flush();
            }
            flush();
        };
        const rng = mulberry32(hashStr(key) ^ Math.imul(wc.seed || 1, 2654435761));
        const hWin = yB - yA;
        for (const f of [1, -1]) {
            let base = sA - (f === 1 ? hWin : 0) - sp + rng() * sp;
            const end = sB + (f === -1 ? hWin : 0) + sp;
            for (; base < end; base += sp * 1.1 + rng() * sp * 0.4) {
                const A1 = sp * (0.25 + rng() * 0.4), l1 = sp * (1.8 + rng() * 1.6), p1 = rng() * 6.283;
                const A2 = sp * 0.18 * rng(), l2 = sp * (0.8 + rng() * 0.9), p2 = rng() * 6.283;
                const wBase = strut * (0.75 + rng() * 0.7); // своя толщина у каждой пряди
                const lw = sp * (2.2 + rng() * 2), pw = rng() * 6.283; // волна толщины вдоль пряди
                const pts = [], hws = [];
                for (let y = yAe;; y += 1.2) {
                    const yy = Math.min(y, yBe);
                    const t = yy - yA;
                    const sv = base + f * t + A1 * Math.sin((t * 6.283) / l1 + p1) + A2 * Math.sin((t * 6.283) / l2 + p2);
                    pts.push([sv, yy]);
                    // градиент: у дна прядь заметно толще, кверху сходит на тонкую
                    const grad = 1.45 - 0.75 * ((yy - yAe) / (yBe - yAe || 1));
                    hws.push(Math.max(0.55, (wBase / 2) * grad * (1 + 0.35 * Math.sin((t * 6.283) / lw + pw))));
                    if (yy >= yBe)
                        break;
                }
                emitStrand(pts, hws);
            }
        }
    };
    // Наклонная сотовая панель: вместо сплошного клина пандуса — тонкая
    // панель вдоль гипотенузы с гекс-решёткой и рамкой (верхний стык со
    // стенкой, нижний пояс у дна, боковые пояса). Толщина по перпендикуляру
    // к наклонной плоскости ≈ толщине стенки.
    const buildHexRamp = (orient, facePos, dir, s0, s1, yTop, yBot0, run, thk, hexSize, embed, tag) => {
        const yBot = yBot0 - 0.6; // слегка утапливаем в дно для сращивания
        const dh = yTop - yBot;
        const Lslope = Math.hypot(run, dh);
        const thkH = Math.min((thk * Lslope) / Math.max(dh, 0.1), thk * 2.2); // горизонтальная толщина
        const toO = (u) => facePos + dir * ((u * run) / Lslope);
        const toY = (u) => yTop - (u * dh) / Lslope;
        const p3 = (o, y, sv) => (orient === "x" ? [o, y, sv] : [sv, y, o]);
        const pushQuadUS = (corners) => {
            // corners: 4 точки [u, s]; передняя грань на наклонной плоскости,
            // задняя — сдвиг по горизонтали внутрь (к стенке)
            const qa = corners.map(([u, sv]) => p3(toO(u), toY(u), sv));
            const qb = corners.map(([u, sv]) => p3(toO(u) - dir * thkH, toY(u), sv));
            solids.push(prismSolid(qa, qb, tag));
        };
        const railSide = 2.5, railTop = 3, railBot = 3.5;
        const uA = railTop, uB = Lslope - railBot;
        const sA = s0 + railSide, sB = s1 - railSide;
        if (sB - sA < hexSize * 0.9 || uB - uA < hexSize * 0.9) {

                    const r = q[i] / p[i];

                        if (r > t0)
                            t0 = r;

                            return null;

        if (wc.face === "hex" && wc.drop === "none")
            buildHexWall(key, wc, thk, sym, s0, s1, mapFn);
        else if (wc.face === "lines" && wc.drop === "none")
            buildLinesWall(key, wc, thk, sym, s0, s1, mapFn);

    const rectMinusBoxes = (xa, za, xb, zb) => {
        let rects = [[xa, za, xb, zb]];
        for (const f of L.fixed) {
            const out = [];
            for (const [x0, z0, x1, z1] of rects) {
                if (f.fx1 <= x0 + 0.01 || f.fx0 >= x1 - 0.01 || f.fz1 <= z0 + 0.01 || f.fz0 >= z1 - 0.01) {

        if (patch.cols !== undefined || patch.cellWt !== undefined || patch.gridMode !== undefined)
            patch = { rowColWs: null, lockedCellW: {}, ...patch };
        if (patch.rows !== undefined || patch.cellDt !== undefined || patch.gridMode !== undefined)
            patch = { rowDs: null, lockedRows: {}, rowColWs: null, lockedCellW: {}, ...patch };
        setContainers((cs) => cs.map((c, idx) => (idx === sel ? { ...c, ...patch } : c)));
        if (patch.cols !== undefined || patch.rows !== undefined ||
            patch.gridMode !== undefined || patch.cellWt !== undefined || patch.cellDt !== undefined ||
            (cur.gridMode === "size" && (patch.W !== undefined || patch.D !== undefined || patch.wall !== undefined || patch.wallOut !== undefined)))
            setSelection(null);
    };
    const updWall = (key, patch) => updWalls([key], patch);
    const updWalls = (keys, patch) => {
        if (patch.h !== undefined)
            patch = { ...patch, h: Math.min(patch.h, limits.maxH) };
        setContainers((cs) => cs.map((c, idx) => {
            if (idx !== sel)
                return c;
            const walls = { ...c.walls };
            for (const key of keys)
                walls[key] = { ...(walls[key] ?? defWall(c)), ...patch };
            return { ...c, walls };
        }));
    };
    // изменение параметров с учётом замков: при замке ячейки контейнер
    // подстраивает внешний размер, сохраняя внутренние габариты ячейки
    const applyParam = (patch) => {
        const lockO = cur.lockOuter, lockC = cur.lockCell;
        if (lockC && lockO)
            return; // оба замка: структура заблокирована
        if (lockC && cur.gridMode !== "size") {
            const m = { ...cur, ...patch };
            const W2 = 2 * m.wallOut + m.cols * cur.cellW0 + (m.cols - 1) * m.wall;
            const D2 = 2 * m.wallOut + m.rows * cur.cellD0 + (m.rows - 1) * m.wall;
            if (W2 > limits.maxW + 0.01 || D2 > limits.maxD + 0.01 || W2 < 30 || D2 < 30)
                return; // не влезает в принтер
            updCur({ ...patch, W: Math.round(W2 * 10) / 10, D: Math.round(D2 * 10) / 10 });
            return;
        }
        updCur(patch);
    };
    // Магнит соседей (переключатель на вкладке «Раскладка»): сборка
    // сохраняет общий габарит. Ужал контейнер — соседние колонки/ряды
    // выросли на ту же величину (и наоборот). Сосед растёт максимум до
    // лимита принтера; если впитать освободившееся место больше некому,
    // рядом добавляется НОВЫЙ контейнер на остаток (минимум 30 мм).
    // Замки соседа соблюдаются: зафиксированные ячейки не меняются.
    const applyOuterDim = (patch) => {
        // «Зафиксировать внешний размер» — намертво: габарит не меняется ни
        // от ползунков, ни от изменения ячеек внутри, ни магнитом соседей
        if (cur.lockOuter)
            return;
        const isW = "W" in patch;
        const axis = isW ? "W" : "D";
        const gKey = isW ? "gx" : "gy";
        const maxAxis = isW ? limits.maxW : limits.maxD;
        // не даём ужать контейнер ниже суммы его зафиксированных колонок/рядов
        patch = { [axis]: Math.max(patch[axis], minOuterDim(cur, axis)) };
        const myG = cur[gKey];
        const myId = cur.id;
        const magnetOn = magnet;
        const myOther = isW ? cur.D : cur.W;
        const myOtherG = isW ? cur.gy : cur.gx;
        setContainers((cs) => {
            const widthIn = (arr, g) => Math.max(30, ...arr.filter((c) => c[gKey] === g).map((c) => c[axis]));
            const myBefore = widthIn(cs, myG);
            let next = cs.map((c) => (c.id === myId ? { ...c, ...patch } : c));
            if (!magnetOn)
                return next;
            // В связанной сборке контейнеры одной колонки держат общую ширину
            // (одного ряда — общую глубину), иначе вокруг ужатого появляются
            // щели, а соединители расходятся. Поэтому при магните размер
            // применяется ко всей колонке/ряду — кроме контейнеров с глобальными
            // замками; замки ячеек каждого соседа по колонке соблюдаются.
            const mates = cs.filter((c) => c[gKey] === myG && (c.id === myId || (!c.lockOuter && !c.lockCell)));
            const tgt = Math.round(Math.max(patch[axis], ...mates.map((c) => minOuterDim(c, axis))) * 10) / 10;
            next = cs.map((c) => (mates.some((m) => m.id === c.id) ? { ...c, [axis]: tgt } : c));
            let delta = myBefore - widthIn(next, myG); // >0 — место освободилось, соседи растут
            if (Math.abs(delta) < 0.05)
                return next;
            const groupOf = (g) => next.filter((c) => c[gKey] === g);
            const adjustable = [...new Set(next.map((c) => c[gKey]))].filter((g) => g !== myG && groupOf(g).every((c) => !c.lockOuter && !c.lockCell));
            const minOf = (g) => Math.max(...groupOf(g).map((c) => minOuterDim(c, axis)));
            // расширяться может только контейнер, который способен впитать рост
            // свободными ячейками: по ширине — в КАЖДОМ ряду есть незамкнутая
            // ячейка, по глубине — есть незамкнутый ряд
            const canGrow = (cc) => {
                const Lg = layout(cc);
                if (!isW) {
                    const locked = cc.lockedRows || {};
                    return Object.keys(locked).filter((k) => +k >= 0 && +k < Lg.nRows).length < Lg.nRows;
                }
                for (let j = 0; j < Lg.nRows; j++)
                    if (Object.keys(lockedWIn(cc, j)).length >= Lg.nColsAt(j))
                        return false;
                return true;
            };
            const capOf = (g) => (groupOf(g).every(canGrow) ? maxAxis : widthIn(next, g));
            const targets = new Map(adjustable.map((g) => [g, widthIn(next, g)]));
            for (let pass = 0; pass < 3 && Math.abs(delta) > 0.05 && adjustable.length; pass++) {
                const open = adjustable.filter((g) => delta > 0 ? targets.get(g) < capOf(g) - 0.01 : targets.get(g) > minOf(g) + 0.01);
                if (!open.length)
                    break;
                const share = delta / open.length;
                for (const g of open) {
                    const t0 = targets.get(g);
                    const t = Math.max(minOf(g), Math.min(capOf(g), Math.round((t0 + share) * 10) / 10));
                    delta -= t - t0;
                    targets.set(g, t);
                }
            }
            next = next.map((c) => c[gKey] !== myG && targets.has(c[gKey]) && !c.lockOuter && !c.lockCell &&
                Math.abs(targets.get(c[gKey]) - c[axis]) > 0.01
                ? { ...c, [axis]: targets.get(c[gKey]) }
                : c);
            // соседям расти больше некуда (лимит принтера) — остаток закрывает
            // новый контейнер, вставленный сразу за ужатым
            if (delta >= 30) {
                const size = Math.round(delta * 10) / 10;
                next = next.map((c) => (c[gKey] > myG ? { ...c, [gKey]: c[gKey] + 1 } : c));
                const fresh = makeContainer(null, 0, 0);
                next = [...next, {
                        ...fresh,
                        [gKey]: myG + 1,
                        [isW ? "gy" : "gx"]: myOtherG,
                        [axis]: size,
                        [isW ? "D" : "W"]: myOther,
                    }];
            }
            return next;
        });
    };
    // сброс к значениям по умолчанию: без диалогов и перезагрузки,
    // двойное нажатие как защита от случайного клика
    const [resetArm, setResetArm] = useState(false);
    const doReset = () => {
        if (!resetArm) {
            setResetArm(true);
            setTimeout(() => setResetArm(false), 3000);
            return;
        }
        setResetArm(false);
        try {
            window.localStorage.removeItem("trayGenState");
        }
        catch (e) { }
        const fresh = { ...makeContainer(null, 0, 0), id: 1 };
        setNextId(2);
        setContainers([fresh]);
        setSel(0);
        setSelection(null);
        setConnect(true);
        setMagnet(true);
        setLimits({ maxW: 170, maxD: 170, maxH: 175, layW: 40, layD: 40 });
        setOpenSecs({ outer: true, cells: true, grid: true, walls: true, project: true, export: true });
        // вкладка не переключается — остаёмся там, где нажали сброс
    };
    const toggleLockOuter = () => updCur({ lockOuter: !cur.lockOuter });
    // Замок ширины держит только ЭТУ ячейку: её ряд получает явные размеры
    // (rowColWs), перегородки других рядов независимы и не обязаны совпадать.
    // Снятие замка размеры НЕ выравнивает — вписанные вручную остаются.
    const toggleCellWLock = (i, j) => {
        const Lc = layout(cur);
        const key = i + ":" + j;
        const locked = { ...(cur.lockedCellW || {}) };
        if (locked[key])
            delete locked[key];
        else
            locked[key] = true;
        const rowColWs = { ...(cur.rowColWs || {}) };
        rowColWs[j] = Lc.rowCols[j].slice();
        updCur({ lockedCellW: locked, rowColWs });
    };
    // глубина у ряда общая (ряды — полосы на всю ширину), её держит замок ряда
    const toggleRowLock = (j) => {
        const Lc = layout(cur);
        const locked = { ...(cur.lockedRows || {}) };
        if (locked[j])
            delete locked[j];
        else
            locked[j] = true;
        updCur({ lockedRows: locked, rowDs: Lc.rowDs.slice() });
    };
    // «Зафиксировать эту ячейку» — превращает ячейку сетки в фиксированную:
    // отдельный контейнер внутри контейнера с жёстким размером и якорем к
    // ближайшему углу или стенке (без координат — бокс скользит со стенкой).
    // Ряд и колонка при этом НЕ блокируются: сетка обтекает бокс.
    const convertToFixed = (i, j) => {
        const Lc = layout(cur);
        const az = j === 0 ? "n" : j === Lc.nRows - 1 ? "s" : "";
        const ax = i === 0 ? "w" : i === Lc.nColsAt(j) - 1 ? "e" : "";
        const anchor = az && ax ? az + ax : ax || az || "w";
        const fc = {
            w: Math.round(Lc.cw(i, j) * 10) / 10,
            d: Math.round(Lc.cd(j) * 10) / 10,
            anchor,
            lvl: getCellLvl(cur, i, j),
        };
        let patch = { fixedCells: [...(cur.fixedCells || []), fc] };
        // ячейка уходит из сетки ряда, остальные растекаются на её место
        const rowW = Lc.rowCols[j];
        if (rowW.length > 1) {
            const rowColWs = { ...(cur.rowColWs || {}) };
            rowColWs[j] = rowW.filter((_, kk) => kk !== i);
            const lw = {};
            for (const key of Object.keys(cur.lockedCellW || {})) {
                const [ii, jj] = key.split(":").map(Number);
                if (jj !== j || ii < i)
                    lw[key] = true;
                else if (ii > i)
                    lw[ii - 1 + ":" + jj] = true;
            }
            patch = { ...patch, rowColWs, lockedCellW: lw };
        }
        updCur(patch);
        setSelection({ type: "fixed", k: (cur.fixedCells || []).length });
    };
    const updFixed = (k, patch) => updCur({ fixedCells: (cur.fixedCells || []).map((f, idx) => (idx === k ? { ...f, ...patch } : f)) });
    const unfixCell = (k) => {
        // настройки стенок бокса (fw:k:*) удаляются, индексы последующих сдвигаются
        const walls = {};
        for (const [wk, wv] of Object.entries(cur.walls || {})) {
            const m = wk.match(/^fw:(\d+):(.+)$/);
            if (!m) {
                walls[wk] = wv;
                continue;
            }
            const idx = +m[1];
            if (idx === k)
                continue;
            walls[idx > k ? `fw:${idx - 1}:${m[2]}` : wk] = wv;
        }
        updCur({ fixedCells: (cur.fixedCells || []).filter((_, idx) => idx !== k), walls });
        setSelection(null);
    };
    // Задать ширину конкретной ячейки: меняется только её ряд, контейнер
    // растёт/ужимается на разницу (другие ряды подстраиваются свободными
    // ячейками). У лимита принтера недостающее добирается у свободных
    // ячеек этого же ряда; зафиксированные не меняются никогда.
    const setCellWidth = (i, j, v) => {
        if ((cur.lockedCellW || {})[i + ":" + j])
            return;
        const Lc = layout(cur);
        const sizes = Lc.rowCols[j].slice();
        const wallSum = 2 * cur.wallOut + (sizes.length - 1) * cur.wall;
        const lockedJ = { ...lockedWIn(cur, j), [i]: true };
        // при зафиксированном габарите ячейка меняется ЗА СЧЁТ свободных
        // соседей в своём ряду — контейнер не растёт и не ужимается
        if (cur.lockOuter) {
            const avail = cur.W - wallSum;
            sizes[i] = Math.max(10, Math.min(v, avail - (sizes.length - 1) * 10));
            updCur({ rowColWs: { ...(cur.rowColWs || {}), [j]: fitSizes(sizes, lockedJ, avail) } });
            return;
        }
        // потолок: остальным ячейкам ряда оставляем хотя бы по 10 мм
        sizes[i] = Math.max(10, Math.min(v, limits.maxW - wallSum - (sizes.length - 1) * 10));
        const want = sizes.reduce((s, x) => s + x, 0) + wallSum;
        const W2 = Math.round(Math.max(30, Math.min(want, limits.maxW)) * 10) / 10;
        const fitted = fitSizes(sizes, lockedJ, W2 - wallSum);
        const rowColWs = { ...(cur.rowColWs || {}) };
        rowColWs[j] = fitted;
        updCur({ rowColWs });
        applyOuterDim({ W: W2 });
    };
    const setRowDepth = (j, v) => {
        if ((cur.lockedRows || {})[j])
            return;
        const Lc = layout(cur);
        const sizes = Lc.rowDs.slice();
        const wallSum = 2 * cur.wallOut + (sizes.length - 1) * cur.wall;
        const lockedJ = { ...(cur.lockedRows || {}), [j]: true };
        if (cur.lockOuter) {
            const avail = cur.D - wallSum;
            sizes[j] = Math.max(10, Math.min(v, avail - (sizes.length - 1) * 10));
            updCur({ rowDs: fitSizes(sizes, lockedJ, avail) });
            return;
        }
        sizes[j] = Math.max(10, Math.min(v, limits.maxD - wallSum - (sizes.length - 1) * 10));
        const want = sizes.reduce((s, x) => s + x, 0) + wallSum;
        const D2 = Math.round(Math.max(30, Math.min(want, limits.maxD)) * 10) / 10;
        const fitted = fitSizes(sizes, lockedJ, D2 - wallSum);
        updCur({ rowDs: fitted });
        applyOuterDim({ D: D2 });
    };
    const updCell = (i, j, patch) => {
        setContainers((cs) => cs.map((cc, idx) => {
            if (idx !== sel)
                return cc;
            const k = i + ":" + j;
            return { ...cc, cells: { ...(cc.cells || {}), [k]: { ...((cc.cells || {})[k] || {}), ...patch } } };
        }));
    };
    const handleSelect = (s) => {
        if (s?.type === "wall" && selMode === "line") {
            setSelection({ type: "line", src: s.key, ...lineOf(cur, s.key) });
        }
        else
            setSelection(s);
    };
    const posMap = useMemo(() => {
        const m = new Map();
        containers.forEach((c, i) => m.set(`${c.gx},${c.gy}`, i));
        return m;
    }, [containers]);
    // ── сборка: соединители по соседям + раскладка сеткой ──
    const built = useMemo(() => {
        const nb = (c, dx, dy) => {
            const i = posMap.get(`${c.gx + dx},${c.gy + dy}`);
            return i === undefined ? null : containers[i];
        };
        // физическая сетка: ширина колонки/глубина ряда = максимум по контейнерам
        const gxs = containers.map((c) => c.gx), gys = containers.map((c) => c.gy);
        const gx0 = Math.min(...gxs), gx1 = Math.max(...gxs);
        const gy0 = Math.min(...gys), gy1 = Math.max(...gys);
        const gap = connect ? 0 : 6;
        const colW = {}, rowD = {};
        for (let g = gx0; g <= gx1; g++)
            colW[g] = Math.max(30, ...containers.filter((c) => c.gx === g).map((c) => c.W));
        for (let g = gy0; g <= gy1; g++)
            rowD[g] = Math.max(30, ...containers.filter((c) => c.gy === g).map((c) => c.D));
        const colX = {}, rowZ = {};
        let acc = 0;
        for (let g = gx0; g <= gx1; g++) {
            colX[g] = acc + colW[g] / 2;
            acc += colW[g] + gap;
        }
        const totalW = acc - gap;
        acc = 0;
        for (let g = gy0; g <= gy1; g++) {
            rowZ[g] = acc + rowD[g] / 2;
            acc += rowD[g] + gap;
        }
        const totalD = acc - gap;
        const items = containers.map((c) => {
            const E = nb(c, 1, 0), Wn = nb(c, -1, 0), S = nb(c, 0, 1), N = nb(c, 0, -1);
            const conn = !connect
                ? { N: null, S: null, W: null, E: null }
                : {
                    E: E ? { male: true, vs: connectorVs(Math.min(c.D, E.D)) } : null,
                    W: Wn ? { male: false, vs: connectorVs(Math.min(c.D, Wn.D)) } : null,
                    S: S ? { male: true, vs: connectorVs(Math.min(c.W, S.W)) } : null,
                    N: N ? { male: false, vs: connectorVs(Math.min(c.W, N.W)) } : null,
                };
            return {
                c,
                solids: buildContainer(c, conn),
                ox: colX[c.gx] - totalW / 2,
                oz: rowZ[c.gy] - totalD / 2,
            };
        });
        return { items, totalW, totalD };
    }, [containers, connect, posMap]);
    // ── three.js: сцена, камера, пикинг ──
    const mountRef = useTrayScene({ built, selection, sel, cur, limits, containers, selMode, setSel, setSelection });
    const L = layout(cur);
    const volume = useMemo(() => solidsVolume(built.items[sel]?.solids ?? []), [built, sel]);
    const exportOne = (idx) => {
        const { solids, c } = built.items[idx];
        exportSTL(solids, `tray${idx + 1}_${c.W}x${c.D}x${c.H}_${c.cols}x${c.rows}.stl`);
    };
    const exportAll = () => built.items.forEach((_, idx) => setTimeout(() => exportOne(idx), idx * 500));
    const [solidBusy, setSolidBusy] = useState(false);
    const exportSolid = async (idx) => {
        setSolidBusy(true);
        try {
            const wasm = await getManifold();
            const { Manifold, Mesh } = wasm;
            const { solids, c } = built.items[idx];
            const parts = solids.map((sl) => {
                const { vp, tv } = weldTris(sl.tris);
                return new Manifold(new Mesh({ numProp: 3, vertProperties: vp, triVerts: tv }));
            });
            const uni = Manifold.union(parts);
            const mesh = uni.getMesh();
            exportSTLIndexed(mesh.vertProperties, mesh.triVerts, `tray${idx + 1}_${c.W}x${c.D}x${c.H}_solid.stl`);
            parts.forEach((p) => p.delete && p.delete());
            uni.delete && uni.delete();
        }
        catch (e) {
            console.error(e);
            alert("Не удалось собрать цельное тело (библиотека Manifold не загрузилась или геометрия не сошлась). Скачиваю обычный STL — слайсер объединит тела сам.");
            exportOne(idx);
        }
        finally {
            setSolidBusy(false);
        }
    };
    // Заполнить раскладку: к существующим контейнерам добавляются новые —
    // колонки и ряды максимально доступного размера (лимит принтера), пока
    // влезают в лимит раскладки; остаток, который меньше лимита принтера,
    // забирает последний контейнер, а слишком мелкий хвост делится пополам
    // с предыдущим. Существующие контейнеры не меняются.
    const fillLayout = () => {
        const gxs2 = containers.map((c) => c.gx), gys2 = containers.map((c) => c.gy);
        const fGx0 = Math.min(...gxs2), fGx1 = Math.max(...gxs2);
        const fGy0 = Math.min(...gys2), fGy1 = Math.max(...gys2);
        const colW = {}, rowD = {};
        for (let g = fGx0; g <= fGx1; g++)
            colW[g] = Math.max(30, ...containers.filter((c) => c.gx === g).map((c) => c.W));
        for (let g = fGy0; g <= fGy1; g++)
            rowD[g] = Math.max(30, ...containers.filter((c) => c.gy === g).map((c) => c.D));
        const extend = (map, g1, total, maxDim) => {
            let rem = total - Object.values(map).reduce((s, v) => s + v, 0);
            let g = g1 + 1;
            while (rem >= 30) {
                let size;
                if (rem > maxDim + 0.01)
                    size = rem - maxDim < 30 ? Math.round((rem / 2) * 10) / 10 : maxDim;
                else
                    size = Math.round(rem * 10) / 10;
                map[g] = size;
                rem -= size;
                g++;
            }
            return g - 1;
        };
        const nGx1 = extend(colW, fGx1, limits.layW * 10, limits.maxW);
        const nGy1 = extend(rowD, fGy1, limits.layD * 10, limits.maxD);
        const occupied = new Set(containers.map((c) => `${c.gx},${c.gy}`));
        const added = [];
        for (let gy = fGy0; gy <= nGy1; gy++)
            for (let gx = fGx0; gx <= nGx1; gx++)
                if (!occupied.has(`${gx},${gy}`))
                    added.push({ ...makeContainer(null, gx, gy), W: colW[gx], D: rowD[gy] });
        if (added.length) {
            setContainers([...containers, ...added]);
            setSelection(null);
        }
